<!doctype html>
<!-- Source for og-cover.png. Re-render at exactly 1200x630:
     "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless --disable-gpu \
       --hide-scrollbars --virtual-time-budget=6000 --window-size=1200,630 \
       --screenshot=assets/og-cover.png assets/og-cover.source.html            -->
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400&amp;family=Inter:wght@400&amp;display=swap" rel="stylesheet">
<style>
:root{--void:#0c1014;--elevated:#13181e;--slate:#2a3138;--steel:#646a70;--ash:#969ba0;--bone:#e7e1d7;--copper:#be674b;
--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;--sans:"Inter",Helvetica,Arial,sans-serif}
*{box-sizing:border-box;margin:0}
body{width:1200px;height:630px;overflow:hidden;background:var(--void);color:var(--bone);font-family:var(--sans);
-webkit-font-smoothing:antialiased}
.card{display:flex;width:1200px;height:630px;flex-direction:column;justify-content:space-between;padding:54px 64px}
.top{display:flex;align-items:center;justify-content:space-between}
.top img{width:104px;height:auto}
.top span{color:var(--steel);font-family:var(--mono);font-size:14px;letter-spacing:.082em;text-transform:uppercase}
h1{max-width:940px;font-size:74px;font-weight:400;letter-spacing:-.016em;line-height:1.05;text-wrap:balance}
.lede{max-width:760px;margin-top:24px;color:var(--ash);font-size:19px;line-height:1.45}
.figures{display:flex;gap:1px;background:var(--slate);border:1px solid var(--slate)}
.figures div{flex:1;padding:20px 22px;background:var(--elevated)}
.figures b{display:block;font-size:27px;font-weight:400;letter-spacing:-.014em}
.figures i{display:block;width:20px;height:2px;margin-bottom:15px;background:var(--copper)}
.figures span{display:block;margin-top:9px;color:var(--steel);font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase}
</style>
</head>
<body>
  <div class="card">
    <div class="top"><img src="ace-white-logomark.png" alt=""><span>AI Deployment Co.</span></div>
    <div>
      <h1>AI For The Private Capital Industry</h1>
      <p class="lede">Systems that increase investment-team capacity, accelerate critical workflows and improve portfolio visibility &mdash; with governance built in.</p>
    </div>
    <div class="figures">
      <div><i></i><b>$4.5B AUM</b><span>PE deployment</span></div>
      <div><i></i><b>47%</b><span>Less IC prep</span></div>
      <div><i></i><b>11 &rarr; 3 days</b><span>Reporting cycle</span></div>
      <div><i></i><b>350+ hours</b><span>Returned</span></div>
    </div>
  </div>
</body>
</html>
